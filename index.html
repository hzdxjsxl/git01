<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Style Scroll 3D Explosion Animation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="hero">
        <div class="hero-content">
            <h1>滚动探索</h1>
            <p>向下滚动体验 3D 爆炸拆解动画</p>
            <div class="scroll-indicator">↓ 向下滚动</div>
        </div>
    </section>

    <section class="animation-section">
        <div class="animation-wrapper">
            <div class="perspective-container">
                <div class="explosion-scene" id="explosionScene">
                    <div class="product-shell"></div>
                    <div class="product-part part-1"></div>
                    <div class="product-part part-2"></div>
                    <div class="product-part part-3"></div>
                    <div class="product-part part-4"></div>
                    <div class="product-part part-5"></div>
                    <div class="product-part part-6"></div>
                </div>
            </div>
        </div>
    </section>

    <section class="spacer"></section>

    <section class="footer">
        <div class="footer-content">
            <h2>体验完成</h2>
            <p>基于原生 JS 和 CSS 3D Transforms</p>
        </div>
    </section>

    <script src="scrollDebouncer.js"></script>
    <script src="animationController.js"></script>
    <script src="main.js"></script>
</body>
</html>
