<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机械虫子 - IK 逆运动学动画</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>机械虫子 · IK 逆运动学演示</h1>
        <p class="hint">移动鼠标控制虫子爬行方向</p>
        <canvas id="canvas"></canvas>
        <div class="controls">
            <div class="control-group">
                <label>节段数量: <span id="segmentCount">12</span></label>
                <input type="range" id="segmentSlider" min="5" max="30" value="12">
            </div>
            <div class="control-group">
                <label>节段长度: <span id="segmentLength">25</span></label>
                <input type="range" id="lengthSlider" min="10" max="50" value="25">
            </div>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
