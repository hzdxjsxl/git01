<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>银河系粒子系统 - Galaxy Particle System</title>
  <meta name="description" content="Three.js 高性能银河系粒子系统动画，支持鼠标引力交互">
</head>
<body>
  <div id="app-container"></div>
  <div class="info-panel">
    <h1>银河系粒子系统</h1>
    <p class="subtitle">Galaxy Particle System</p>
    <div class="controls-info">
      <div class="control-item">
        <span class="key">🖱️ 移动</span>
        <span class="desc">排斥粒子</span>
      </div>
      <div class="control-item">
        <span class="key">🖱️ 拖拽</span>
        <span class="desc">旋转视角</span>
      </div>
      <div class="control-item">
        <span class="key">滚轮</span>
        <span class="desc">缩放</span>
      </div>
    </div>
    <p class="stats">粒子数量: 100,000</p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
