<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑车轮毂定制器 - Babylon.js</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #fff;
        }
        
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        #ui-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            background: rgba(26, 26, 46, 0.95);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
        
        #ui-container h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #e94560;
            border-bottom: 2px solid #e94560;
            padding-bottom: 10px;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #aaa;
        }
        
        .control-group input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
        }
        
        .control-group input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
        }
        
        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .control-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        .value-display {
            text-align: right;
            font-size: 0.85rem;
            color: #e94560;
            margin-top: 5px;
        }
        
        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        
        .preset-btn {
            padding: 10px 15px;
            border: 2px solid #333;
            border-radius: 8px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
        }
        
        .preset-btn:hover {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.1);
        }
        
        .info-panel {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            font-size: 0.8rem;
            color: #888;
        }
        
        .info-panel p {
            margin-bottom: 5px;
        }
        
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
        
        #loading-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .loading-text {
            margin-top: 20px;
            color: #aaa;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p class="loading-text">正在加载 3D 场景...</p>
    </div>
    
    <div id="ui-container">
        <h2>轮毂定制</h2>
        
        <div class="control-group">
            <label for="wheel-color">轮毂颜色</label>
            <input type="color" id="wheel-color" value="#c0c0c0">
        </div>
        
        <div class="control-group">
            <label for="roughness">粗糙度</label>
            <input type="range" id="roughness" min="0" max="1" step="0.01" value="0.2">
            <div class="value-display" id="roughness-value">0.20</div>
        </div>
        
        <div class="control-group">
            <label for="environment-intensity">环境反射强度</label>
            <input type="range" id="environment-intensity" min="0" max="3" step="0.1" value="1.5">
            <div class="value-display" id="environment-intensity-value">1.5</div>
        </div>
        
        <div class="control-group">
            <label>预设样式</label>
            <div class="preset-buttons">
                <button class="preset-btn" data-preset="chrome">亮面镀铬</button>
                <button class="preset-btn" data-preset="matte">哑光黑</button>
                <button class="preset-btn" data-preset="gold">金色</button>
                <button class="preset-btn" data-preset="blue">蓝色金属</button>
            </div>
        </div>
        
        <div class="info-panel">
            <p>🖱️ 左键拖动: 旋转视角</p>
            <p>🖱️ 右键拖动: 平移视角</p>
            <p>🖱️ 滚轮: 缩放</p>
        </div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="js/materialGenerator.js"></script>
    <script src="js/wheelCustomizer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
