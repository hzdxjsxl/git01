<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全国降雨量气象大屏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .dashboard {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 600;
        }
        .header .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-top: 5px;
        }
        .main-content {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
        }
        .map-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        #weatherCanvas {
            width: 100%;
            height: 100%;
        }
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar h3 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .legend {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .legend-color {
            width: 30px;
            height: 20px;
            border-radius: 4px;
        }
        .legend-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
        }
        .stats {
            margin-top: auto;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }
        .stat-value {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
        }
        .refresh-btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🌧️ 全国降雨量气象大屏</h1>
            <div class="subtitle">实时监测 · 行进方块算法 · 等高线可视化</div>
        </div>
        <div class="main-content">
            <div class="map-container">
                <canvas id="weatherCanvas"></canvas>
                <div class="loading" id="loading">加载中...</div>
            </div>
            <div class="sidebar">
                <h3>图例</h3>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ffffcc;"></div>
                        <span class="legend-text">0-10 mm</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #c7e9b4;"></div>
                        <span class="legend-text">10-25 mm</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #7fcdbb;"></div>
                        <span class="legend-text">25-50 mm</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #41b6c4;"></div>
                        <span class="legend-text">50-100 mm</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #2c7fb8;"></div>
                        <span class="legend-text">100-150 mm</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #253494;"></div>
                        <span class="legend-text">&gt;150 mm</span>
                    </div>
                </div>
                <div class="stats">
                    <h3>统计数据</h3>
                    <div class="stat-item">
                        <span class="stat-label">监测站点数</span>
                        <span class="stat-value" id="stationCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">平均降雨量</span>
                        <span class="stat-value" id="avgRain">0.0 mm</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">最大降雨量</span>
                        <span class="stat-value" id="maxRain">0.0 mm</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">最小降雨量</span>
                        <span class="stat-value" id="minRain">0.0 mm</span>
                    </div>
                </div>
                <button class="refresh-btn" onclick="refreshData()">🔄 刷新数据</button>
            </div>
        </div>
    </div>
    <script src="weather.js"></script>
</body>
</html>
