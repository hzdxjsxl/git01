<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>医院耗材库存管理系统</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f2f5; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; }
    h1 { text-align: center; color: #1890ff; margin-bottom: 20px; }
    h2 { color: #333; margin: 20px 0 15px; border-left: 4px solid #1890ff; padding-left: 10px; }
    
    .control-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .control-row { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
    .control-group { display: flex; align-items: center; gap: 10px; }
    label { font-weight: 600; color: #333; }
    select, input { padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; min-width: 150px; }
    button { padding: 8px 20px; background: #1890ff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: all 0.3s; }
    button:hover { background: #40a9ff; }
    button.secondary { background: #52c41a; }
    button.secondary:hover { background: #73d13d; }
    button.danger { background: #ff4d4f; }
    button.danger:hover { background: #ff7875; }

    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .stat-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
    .stat-card .label { font-size: 13px; color: #666; margin-bottom: 5px; }
    .stat-card .value { font-size: 28px; font-weight: bold; color: #1890ff; }
    .stat-card.warning .value { color: #faad14; }
    .stat-card.danger .value { color: #ff4d4f; }

    .table-container { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: auto; max-height: 400px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #fafafa; position: sticky; top: 0; z-index: 1; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
    th { font-weight: 600; color: #333; }
    tr:hover { background: #f5f5f5; }
    .used { background: #fff1f0 !important; text-decoration: line-through; opacity: 0.6; }
    .partial { background: #fff7e6 !important; }
    .expiring-soon { color: #faad14; font-weight: 600; }
    .expired { color: #ff4d4f; font-weight: 600; }
    .tag { padding: 2px 8px; border-radius: 10px; font-size: 11px; display: inline-block; }
    .tag-normal { background: #f6ffed; color: #52c41a; }
    .tag-warning { background: #fffbe6; color: #faad14; }
    .tag-danger { background: #fff1f0; color: #ff4d4f; }
    .tag-used { background: #f5f5f5; color: #bfbfbf; }

    .charts-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .chart-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .chart-box canvas { max-height: 300px; }

    .result-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .result-item { padding: 10px; border-left: 3px solid #52c41a; background: #f6ffed; margin-bottom: 10px; border-radius: 4px; }
    .result-item.used { border-left-color: #ff4d4f; background: #fff1f0; }
    .result-item.partial { border-left-color: #faad14; background: #fffbe6; }

    @media (max-width: 768px) {
      .charts-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏥 医院耗材库存管理系统</h1>

    <div class="control-panel">
      <div class="control-row">
        <div class="control-group">
          <label>选择耗材:</label>
          <select id="materialSelect"></select>
        </div>
        <div class="control-group">
          <label>消耗数量:</label>
          <input type="number" id="consumeQty" value="500" min="1">
        </div>
        <button onclick="runFIFO()">执行FIFO消耗计算</button>
        <button class="secondary" onclick="resetData()">重置数据</button>
        <button class="danger" onclick="loadData()">重新加载数据</button>
      </div>
    </div>

    <div class="stats-row" id="statsRow"></div>

    <h2>📊 库存分布</h2>
    <div class="charts-container">
      <div class="chart-box">
        <h3 style="margin-bottom: 15px; text-align: center;">按批次数量分布</h3>
        <canvas id="batchChart"></canvas>
      </div>
      <div class="chart-box">
        <h3 style="margin-bottom: 15px; text-align: center;">按过期状态分布</h3>
        <canvas id="expireChart"></canvas>
      </div>
    </div>

    <h2>📋 原始入库明细</h2>
    <div class="table-container">
      <table id="inventoryTable">
        <thead>
          <tr>
            <th>批次号</th>
            <th>耗材名称</th>
            <th>规格</th>
            <th>入库数量</th>
            <th>剩余数量</th>
            <th>单位</th>
            <th>入库日期</th>
            <th>过期日期</th>
            <th>过期状态</th>
            <th>生产厂家</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <h2>🔍 FIFO消耗计算结果</h2>
    <div class="result-panel" id="resultPanel">
      <p style="color: #999; text-align: center;">请选择耗材并输入消耗数量，点击"执行FIFO消耗计算"查看结果</p>
    </div>

    <h2>📝 消耗后剩余库存</h2>
    <div class="table-container">
      <table id="remainingTable">
        <thead>
          <tr>
            <th>批次号</th>
            <th>耗材名称</th>
            <th>规格</th>
            <th>原数量</th>
            <th>已用数量</th>
            <th>剩余数量</th>
            <th>过期日期</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    let originalData = [];
    let workingData = [];
    let batchChart = null;
    let expireChart = null;
    const today = new Date('2026-05-20');

    async function loadData() {
      try {
        const response = await fetch('/api/inventory');
        const result = await response.json();
        if (result.success) {
          originalData = JSON.parse(JSON.stringify(result.data));
          workingData = JSON.parse(JSON.stringify(result.data));
          initMaterialSelect();
          renderTable();
          renderStats();
          renderCharts();
        }
      } catch (error) {
        alert('加载数据失败: ' + error.message);
      }
    }

    function initMaterialSelect() {
      const materials = [...new Set(originalData.map(item => item.name))];
      const select = document.getElementById('materialSelect');
      select.innerHTML = '<option value="">全部耗材</option>';
      materials.forEach(m => {
        select.innerHTML += `<option value="${m}">${m}</option>`;
      });
    }

    function getExpireStatus(expireDate) {
      const expire = new Date(expireDate);
      const diffDays = Math.ceil((expire - today) / (1000 * 60 * 60 * 24));
      if (diffDays < 0) return { status: 'expired', text: '已过期', days: diffDays };
      if (diffDays <= 30) return { status: 'soon', text: '临期(' + diffDays + '天)', days: diffDays };
      if (diffDays <= 90) return { status: 'warning', text: '即将过期(' + diffDays + '天)', days: diffDays };
      return { status: 'normal', text: '正常', days: diffDays };
    }

    function getStatusTag(status) {
      if (status === 'expired') return '<span class="tag tag-danger">已过期</span>';
      if (status === 'soon') return '<span class="tag tag-danger">临期</span>';
      if (status === 'warning') return '<span class="tag tag-warning">预警</span>';
      return '<span class="tag tag-normal">正常</span>';
    }

    function renderTable() {
      const tbody = document.querySelector('#inventoryTable tbody');
      tbody.innerHTML = '';
      workingData.forEach(item => {
        const expireInfo = getExpireStatus(item.expireDate);
        const rowClass = item.remaining === 0 ? 'used' : (item.used > 0 ? 'partial' : '');
        const qtyClass = expireInfo.status === 'expired' ? 'expired' : (expireInfo.status === 'soon' ? 'expiring-soon' : '');
        tbody.innerHTML += `
          <tr class="${rowClass}">
            <td>${item.batchNo}</td>
            <td>${item.name}</td>
            <td>${item.spec}</td>
            <td>${item.quantity}</td>
            <td class="${qtyClass}">${item.remaining ?? item.quantity}</td>
            <td>${item.unit}</td>
            <td>${item.inDate}</td>
            <td class="${qtyClass}">${item.expireDate}</td>
            <td>${getStatusTag(expireInfo.status)}</td>
            <td>${item.manufacturer}</td>
          </tr>
        `;
      });
    }

    function renderStats() {
      const totalQty = workingData.reduce((sum, item) => sum + (item.remaining ?? item.quantity), 0);
      const totalValue = workingData.reduce((sum, item) => sum + item.quantity, 0);
      const expired = workingData.filter(item => getExpireStatus(item.expireDate).status === 'expired' && (item.remaining ?? item.quantity) > 0);
      const expiringSoon = workingData.filter(item => getExpireStatus(item.expireDate).status === 'soon' && (item.remaining ?? item.quantity) > 0);
      const expiringQty = expired.reduce((sum, item) => sum + (item.remaining ?? item.quantity), 0);
      const soonQty = expiringSoon.reduce((sum, item) => sum + (item.remaining ?? item.quantity), 0);

      document.getElementById('statsRow').innerHTML = `
        <div class="stat-card">
          <div class="label">总库存数量</div>
          <div class="value">${totalQty.toLocaleString()}</div>
        </div>
        <div class="stat-card">
          <div class="label">入库批次总数</div>
          <div class="value">${workingData.length}</div>
        </div>
        <div class="stat-card warning">
          <div class="label">临期库存(30天内)</div>
          <div class="value">${soonQty.toLocaleString()}</div>
        </div>
        <div class="stat-card danger">
          <div class="label">已过期库存</div>
          <div class="value">${expiringQty.toLocaleString()}</div>
        </div>
      `;
    }

    function renderCharts() {
      const ctx1 = document.getElementById('batchChart').getContext('2d');
      const ctx2 = document.getElementById('expireChart').getContext('2d');

      if (batchChart) batchChart.destroy();
      if (expireChart) expireChart.destroy();

      const batchLabels = workingData.map(item => item.batchNo.slice(-6));
      const batchData = workingData.map(item => item.remaining ?? item.quantity);
      const batchColors = workingData.map(item => {
        const status = getExpireStatus(item.expireDate).status;
        if (status === 'expired') return '#ff4d4f';
        if (status === 'soon') return '#faad14';
        if (status === 'warning') return '#ffc53d';
        return '#52c41a';
      });

      batchChart = new Chart(ctx1, {
        type: 'pie',
        data: {
          labels: batchLabels,
          datasets: [{
            data: batchData,
            backgroundColor: batchColors,
            borderWidth: 2,
            borderColor: '#fff'
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'right', labels: { font: { size: 11 } } }
          }
        }
      });

      let normalQty = 0, warningQty = 0, soonQty = 0, expiredQty = 0;
      workingData.forEach(item => {
        const qty = item.remaining ?? item.quantity;
        const status = getExpireStatus(item.expireDate).status;
        if (status === 'expired') expiredQty += qty;
        else if (status === 'soon') soonQty += qty;
        else if (status === 'warning') warningQty += qty;
        else normalQty += qty;
      });

      expireChart = new Chart(ctx2, {
        type: 'doughnut',
        data: {
          labels: ['正常', '预警(90天内)', '临期(30天内)', '已过期'],
          datasets: [{
            data: [normalQty, warningQty, soonQty, expiredQty],
            backgroundColor: ['#52c41a', '#ffc53d', '#faad14', '#ff4d4f'],
            borderWidth: 2,
            borderColor: '#fff'
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'right', labels: { font: { size: 11 } } }
          }
        }
      });
    }

    function runFIFO() {
      const materialName = document.getElementById('materialSelect').value;
      const consumeQty = parseInt(document.getElementById('consumeQty').value);

      if (!materialName) {
        alert('请选择具体的耗材类型！');
        return;
      }
      if (!consumeQty || consumeQty <= 0) {
        alert('请输入有效的消耗数量！');
        return;
      }

      workingData = JSON.parse(JSON.stringify(originalData));
      workingData.forEach(item => {
        item.remaining = item.quantity;
        item.used = 0;
      });

      const filtered = workingData
        .filter(item => item.name === materialName)
        .sort((a, b) => new Date(a.inDate) - new Date(b.inDate));

      const totalAvailable = filtered.reduce((sum, item) => sum + item.remaining, 0);
      if (consumeQty > totalAvailable) {
        alert(`库存不足！当前"${materialName}"总库存只有 ${totalAvailable} 个，无法消耗 ${consumeQty} 个`);
        return;
      }

      let remainingConsume = consumeQty;
      const usedBatches = [];
      const partialBatches = [];

      for (let item of filtered) {
        if (remainingConsume <= 0) break;
        
        if (item.remaining <= remainingConsume) {
          item.used = item.remaining;
          item.remaining = 0;
          remainingConsume -= item.used;
          usedBatches.push({ ...item });
        } else {
          item.used = remainingConsume;
          item.remaining = item.quantity - item.used;
          remainingConsume = 0;
          partialBatches.push({ ...item });
        }
      }

      renderResult(consumeQty, materialName, usedBatches, partialBatches, totalAvailable);
      renderTable();
      renderStats();
      renderCharts();
      renderRemainingTable(materialName);
    }

    function renderResult(consumeQty, materialName, usedBatches, partialBatches, totalAvailable) {
      const panel = document.getElementById('resultPanel');
      let html = `
        <div style="margin-bottom: 15px; padding: 15px; background: #e6f7ff; border-radius: 4px; border-left: 4px solid #1890ff;">
          <strong>消耗信息：</strong>耗材【${materialName}】计划消耗 ${consumeQty} 个，总库存 ${totalAvailable} 个，消耗后剩余 ${totalAvailable - consumeQty} 个
        </div>
      `;

      if (usedBatches.length > 0) {
        html += '<h4 style="margin: 15px 0 10px; color: #ff4d4f;">以下批次被完全消耗：</h4>';
        usedBatches.forEach(batch => {
          html += `
            <div class="result-item used">
              <strong>${batch.batchNo}</strong> | ${batch.name} ${batch.spec} | 入库 ${batch.quantity} ${batch.unit} | 全部用完 | 过期日期: ${batch.expireDate}
            </div>
          `;
        });
      }

      if (partialBatches.length > 0) {
        html += '<h4 style="margin: 15px 0 10px; color: #faad14;">以下批次被部分消耗：</h4>';
        partialBatches.forEach(batch => {
          html += `
            <div class="result-item partial">
              <strong>${batch.batchNo}</strong> | ${batch.name} ${batch.spec} | 入库 ${batch.quantity} ${batch.unit} | 已用 ${batch.used} | 剩余 ${batch.remaining} | 过期日期: ${batch.expireDate}
            </div>
          `;
        });
      }

      const unchanged = workingData.filter(item => item.name === materialName && item.used === 0);
      if (unchanged.length > 0) {
        html += '<h4 style="margin: 15px 0 10px; color: #52c41a;">以下批次未被消耗：</h4>';
        unchanged.forEach(batch => {
          html += `
            <div class="result-item">
              <strong>${batch.batchNo}</strong> | ${batch.name} ${batch.spec} | 库存 ${batch.remaining} ${batch.unit} | 过期日期: ${batch.expireDate}
            </div>
          `;
        });
      }

      panel.innerHTML = html;
    }

    function renderRemainingTable(materialName) {
      const tbody = document.querySelector('#remainingTable tbody');
      tbody.innerHTML = '';
      
      const filtered = workingData
        .filter(item => item.name === materialName)
        .sort((a, b) => new Date(a.inDate) - new Date(b.inDate));

      filtered.forEach(item => {
        const expireInfo = getExpireStatus(item.expireDate);
        let status = '';
        if (item.remaining === 0) status = '<span class="tag tag-used">已用完</span>';
        else if (item.used > 0) status = '<span class="tag tag-warning">部分使用</span>';
        else status = getStatusTag(expireInfo.status);

        tbody.innerHTML += `
          <tr class="${item.remaining === 0 ? 'used' : (item.used > 0 ? 'partial' : '')}">
            <td>${item.batchNo}</td>
            <td>${item.name}</td>
            <td>${item.spec}</td>
            <td>${item.quantity}</td>
            <td>${item.used || 0}</td>
            <td style="font-weight: bold;">${item.remaining}</td>
            <td>${item.expireDate}</td>
            <td>${status}</td>
          </tr>
        `;
      });
    }

    function resetData() {
      workingData = JSON.parse(JSON.stringify(originalData));
      workingData.forEach(item => {
        delete item.remaining;
        delete item.used;
      });
      renderTable();
      renderStats();
      renderCharts();
      document.getElementById('resultPanel').innerHTML = '<p style="color: #999; text-align: center;">请选择耗材并输入消耗数量，点击"执行FIFO消耗计算"查看结果</p>';
      document.querySelector('#remainingTable tbody').innerHTML = '';
    }

    loadData();
  </script>
</body>
</html>
